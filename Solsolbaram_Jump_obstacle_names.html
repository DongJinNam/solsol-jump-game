<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>솔솔바람 점프</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #08173e;
    font-family: Arial, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    touch-action: manipulation;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
  #hud {
    position: fixed;
    inset: 0 0 auto 0;
    padding: 12px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    color: white;
    z-index: 3;
    pointer-events: none;
    text-shadow: 0 2px 4px rgba(0,0,0,.35);
  }
  #progressWrap {
    flex: 1;
    height: 15px;
    border: 2px solid rgba(255,255,255,.8);
    border-radius: 20px;
    overflow: hidden;
    background: rgba(255,255,255,.18);
  }
  #progress {
    width: 0%;
    height: 100%;
    background: linear-gradient(90deg,#79e8ff,#ffe66b);
  }
  #percent {
    min-width: 44px;
    text-align: right;
    font-weight: 800;
  }
  #score {
    min-width: 72px;
    font-weight: 800;
  }
  .panel {
    position: fixed;
    z-index: 10;
    left: 50%;
    top: 50%;
    transform: translate(-50%,-50%);
    width: min(90vw, 440px);
    color: #16385e;
    background: rgba(255,255,255,.97);
    border: 4px solid #78d8ed;
    border-radius: 24px;
    padding: 24px 22px;
    text-align: center;
    box-shadow: 0 14px 45px rgba(0,0,0,.35);
  }
  .panel h1 {
    margin: 0 0 14px;
    font-size: 30px;
    color: #188fbd;
  }
  .panel p {
    margin: 0 0 18px;
    font-size: 16px;
    line-height: 1.8;
  }
  .panel button {
    border: 0;
    border-radius: 999px;
    background: #24a8d8;
    color: white;
    font-weight: 800;
    font-size: 18px;
    padding: 13px 30px;
    min-width: 160px;
    cursor: pointer;
  }
  #result { display:none; }
  #successMessage { margin:16px 0 0; font-size:14px; color:#5f7891; }
  .small {
    color:#5f7891;
    font-size:14px;
  }

  #hud { flex-wrap:wrap; background:linear-gradient(#08173ecc,transparent); }
  #progressWrap { min-width:65px; }
  #hearts { color:#ff9cbe; letter-spacing:3px; }
  #controls { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); z-index:12; display:flex; align-items:center; gap:10px; padding:10px 16px; border:1px solid #8be9f580; border-radius:20px; background:#102a67ed; color:white; white-space:nowrap; }
  select, #pauseBtn { font:inherit; padding:8px; border-radius:10px; border:1px solid #8be9f5; background:#fff; color:#16385e; }
  .panel { max-height:calc(100dvh - 150px); overflow:auto; top:46%; }
  #quiz { display:none; border-color:#b8a0ff; }
  #quizChoices { display:grid; gap:9px; }
  #quizChoices button { min-width:0; width:100%; border-radius:14px; font-size:16px; background:#eef4ff; color:#27426a; border:2px solid #d8e6ff; }
  #quizChoices button:disabled { opacity:.5; }
  #quizFeedback { min-height:48px; margin:14px 0; font-size:15px; }
  #quizContinue { display:none; }
  button:focus-visible, select:focus-visible { outline:3px solid #ffcc55; outline-offset:3px; }
  .monster { display:block; margin:0 auto 8px; width:100px; height:90px; animation:float 1.8s ease-in-out infinite; }
  @keyframes float { 50% { transform:translateY(-6px) rotate(4deg); } }
  @media(max-width:520px) { #hud { font-size:13px; gap:6px; } .panel { padding:18px 16px; } .panel h1 { font-size:24px; } .panel p { font-size:14px; } #controls { font-size:13px; bottom:12px; padding:8px; } }
  @media(prefers-reduced-motion:reduce) { .monster { animation:none; } }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div id="score">⭐ 0</div><div id="hearts" aria-label="남은 하트 3개">♥♥♥</div><div id="collectCount">별 0 · 콤보 0</div>
  <div id="progressWrap"><div id="progress"></div></div>
  <div id="percent">0%</div>
</div>

<div id="start" class="panel">
  <h1>🌬️ 솔솔바람 점프</h1>
  <p>
    <b>게임 방법</b><br>
    화면을 누르거나 스페이스바 / ↑ 키를 눌러 점프해요.<br>
    <b>공중에서 한 번 더 누르면 이중점프!</b><br><br>
    알약 · 주사기 · 약병 · 반창고 장애물을 피해<br>
    별을 모으며 100%까지 달려가면 성공이에요.<br>
    <span class="small">별은 50점! 연속 획득 보너스도 있어요.<br>하트는 3개, 괴물 퀴즈는 정답까지 다시 도전!<br>아래에서 달리기 속도를 언제든 바꿀 수 있어요.</span>
  </p>
  <button id="startBtn" type="button">게임 시작</button>
</div>

<div id="result" class="panel">
  <h1 id="resultTitle">잘했어요! 🎉</h1>
  <p id="resultText"></p>
  <button id="restartBtn" type="button">다시 도전</button>
  <p id="successMessage" hidden>모험 성공 이미지를 캡처해서 솔솔바람에 보내주세요</p>
</div>

<div id="controls"><label for="speedSelect">진행 속도</label><select id="speedSelect"><option value="0.7">느리게</option><option value="1" selected>보통</option><option value="1.3">빠르게</option></select><button id="pauseBtn" type="button">일시정지</button></div>
<div id="quiz" class="panel" role="dialog" aria-modal="true" aria-labelledby="quizTitle">
<svg class="monster" viewBox="0 0 100 90" aria-hidden="true"><path d="M22 28L14 7 39 21M64 21L87 7 79 34" fill="#ffd889" stroke="#8c64d9" stroke-width="4"/><rect x="10" y="20" width="80" height="64" rx="30" fill="#b89aff" stroke="#e0d4ff" stroke-width="3"/><ellipse cx="35" cy="46" rx="10" ry="13" fill="white"/><ellipse cx="65" cy="46" rx="10" ry="13" fill="white"/><circle cx="37" cy="48" r="5" fill="#293b68"/><circle cx="63" cy="48" r="5" fill="#293b68"/><path d="M37 66Q50 78 64 65" fill="none" stroke="#493c75" stroke-width="4" stroke-linecap="round"/><circle cx="23" cy="62" r="6" fill="#ffb8d4"/><circle cx="77" cy="62" r="6" fill="#ffb8d4"/></svg>
<h1 id="quizTitle">별지기 몽글이의 퀴즈</h1><p id="quizQuestion"></p><div id="quizChoices"></div><p id="quizFeedback" role="status" aria-live="polite"></p><button id="quizContinue" type="button">모험 계속하기</button></div>

  const speedSelect = document.getElementById('speedSelect');
  const quizPanel = document.getElementById('quiz');
  const quizChoices = document.getElementById('quizChoices');
  const quizFeedback = document.getElementById('quizFeedback');
  const quizContinue = document.getElementById('quizContinue');
  const pauseBtn = document.getElementById('pauseBtn');
  const questions = [
    {q:'공중에서 한 번 더 점프하려면?', a:['아무것도 누르지 않기','화면 또는 점프 키를 한 번 더 누르기','속도만 바꾸기'], correct:1, hint:'점프는 공중에서도 한 번 더 할 수 있어요.'},
    {q:'반짝이는 별을 모으면 무엇을 얻을까요?', a:['점수와 연속 획득 보너스','장애물이 더 생겨요','하트가 줄어요'], correct:0, hint:'별을 모으면 위쪽 점수판의 숫자가 올라가요.'},
    {q:'퀴즈를 틀렸을 때는 어떻게 하면 될까요?', a:['처음부터 다시 시작하기','게임을 끝내기','힌트를 읽고 다른 답 고르기'], correct:2, hint:'몽글이는 정답을 찾을 때까지 기다려줘요.'}
  ];
  let hearts=3, invincible=0, starPoints=0, quizPoints=0, collected=0, combo=0;
  let quizIndex=0, quizActive=false, quizSolved=false, paused=false, popups=[];
  let lastTime=0, accumulator=0;
  let W=0, H=0, ground=0;
  let running=false, animationId=null, camera=0, speed=2.8, score=0, frame=0;
  const LEVEL_END = 4700;

  const player = {
    x: 120,
    y: 0,
    w: 74,
    h: 56,
    vy: 0,
    jumpCount: 0,
    rotation: 0
  };

  const obstacleNames = ["알약","주사기","약병","반창고","비타민"];
  const obstaclePositions = [
    620, 910, 1200, 1500, 1790, 2070, 2380, 2670,
    2950, 3240, 3520, 3790, 4070, 4350
  ];
  // 같은 장애물만 반복되지 않도록 5가지 모양을 순환해요.
  const obstacleStyles = ["capsule","syringe","vial","bandage","vitamin"];
  // 일부 장애물에는 치료를 상징하는 약/주사 이모티콘을 넣어요.
  const obstacleIcons = ["💊", "", "💉", "💊", ""];

  let obstacles = [];
  let stars = [];
  let particles = [];

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.floor(W*dpr);
    canvas.height = Math.floor(H*dpr);
    canvas.style.width = W+"px";
    canvas.style.height = H+"px";
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ground = H - Math.max(92, H*0.16);
    player.x = Math.min(120, W*.2);
    if (!running) player.y = ground-player.h;
  }

  function buildLevel() {
    obstacles = obstaclePositions.map((x,i) => {
      const style = obstacleStyles[i % obstacleStyles.length];
      const size = style === "capsule" ? {w:54,h:32} :
                   style === "vial" ? {w:40,h:49} :
                   style === "doubleSpike" ? {w:50,h:40} :
                   style === "crystal" ? {w:44,h:44} : {w:40,h:42};
      return {
        x,
        y: ground-size.h,
        w: size.w,
        h: size.h,
        style,
        icon: obstacleIcons[i % obstacleIcons.length],
        label: obstacleNames[i % obstacleNames.length]
      };
    });

    // Reachable arcs above obstacles, plus lower stars between them.
    stars = obstaclePositions.flatMap((x)=>[
      {x:x+12,y:ground-112,r:15,taken:false},
      {x:x+110,y:ground-82,r:15,taken:false},
      {x:x+195,y:ground-40,r:15,taken:false}
    ]);
  }

  function resetGame() {
    hearts=3; invincible=0; starPoints=0; quizPoints=0; collected=0; combo=0;
    quizIndex=0; quizActive=false; quizSolved=false; paused=false; popups=[];
    quizPanel.style.display='none'; pauseBtn.textContent='일시정지';
    lastTime=0; accumulator=0;
    camera=0;
    speed=2.8;
    score=0;
    frame=0;
    player.y=ground-player.h;
    player.vy=0;
    player.jumpCount=0;
    player.rotation=0;
    particles=[];
    buildLevel();
    updateHud();
  }

  function startGame() {
    startPanel.style.display="none";
    resultPanel.style.display="none";
    resetGame();
    running=true;
    startBtn.blur(); restartBtn.blur();
    cancelAnimationFrame(animationId);
    loop();
  }

  function jump() {
    if(!running || quizActive || paused) return;
    if(player.jumpCount < 2) {
      player.vy = player.jumpCount === 0 ? -12.2 : -10.8;
      player.jumpCount++;
      burst(player.x + player.w/2, player.y + player.h, player.jumpCount===1 ? "#d8f8ff" : "#ffe58a");
    }
  }

  function update() {
    if (!running || paused || quizActive) return;
    frame++;
    speed = (3.2 + Math.min(1.2,camera/3900)) * Number(speedSelect.value);
    camera += speed;
    invincible=Math.max(0,invincible-1);
    if (quizIndex<questions.length && camera>=LEVEL_END*(quizIndex+1)/4) {
      openQuiz(); return;
    }

    player.vy += 0.62;
    player.y += player.vy;

    if (player.y >= ground-player.h) {
      player.y = ground-player.h;
      player.vy = 0;
      player.jumpCount = 0;
      player.rotation *= 0.72;
    } else {
      player.rotation += 0.035;
    }

    for (const o of obstacles) {
      const ox = o.x-camera;
      if (!invincible && obstacleHit(
        player.x+12, player.y+10, player.w-24, player.h-14,
        o, ox
      )) {
        hearts--; invincible=110; combo=0;
        burst(player.x+player.w/2,player.y+player.h/2,'#ff9cbe');
        popups.push({x:player.x,y:player.y-20,text:'앗! 하트 -1',life:65});
        if(hearts<=0) { finish(false); return; }
      }
    }

    for (const s of stars) {
      if (s.taken) continue;
      const sx = s.x-camera;
      if(sx < player.x-25 && !s.missed) { s.missed=true; combo=0; }
      const cx = Math.max(player.x,Math.min(sx,player.x+player.w));
      const cy = Math.max(player.y,Math.min(s.y,player.y+player.h));
      if (Math.hypot(cx-sx,cy-s.y) < s.r+8) {
        s.taken=true;
        combo++; collected++;
        const points=50+Math.min(combo-1,5)*10;
        starPoints+=points;
        popups.push({x:sx,y:s.y-22,text:`+${points}${combo>1?' · '+combo+' 콤보!':''}`,life:60});
        burst(sx,s.y,"#ffe66b");
      }
    }

    particles.forEach(p=>{
      p.x+=p.vx; p.y+=p.vy; p.vy+=.12; p.life--;
    });
    particles = particles.filter(p=>p.life>0);

    popups.forEach(p=>{p.y-=.65;p.life--});
    popups=popups.filter(p=>p.life>0);
    if (camera >= LEVEL_END) {
      finish(true);
      return;
    }
    updateHud();
  }

  function updateHud() {
    score=Math.floor(camera/12)+starPoints+quizPoints;
    document.getElementById('hearts').textContent='♥'.repeat(hearts)+'♡'.repeat(3-hearts);
    document.getElementById('hearts').ariaLabel=`남은 하트 ${hearts}개`;
    document.getElementById('collectCount').textContent=`별 ${collected} · 콤보 ${combo}`;
    const pct = Math.max(0,Math.min(100,Math.floor(camera/LEVEL_END*100)));
    scoreEl.textContent = "⭐ " + score;
    progressEl.style.width = pct + "%";
    percentEl.textContent = pct + "%";
  }

  function finish(success) {
    updateHud();
    running=false;
    cancelAnimationFrame(animationId);
    resultPanel.style.display="block";
    document.getElementById('successMessage').hidden = !success;
    if(success) {
      resultTitle.textContent="모험 성공! 🎉";
      resultText.innerHTML="끝까지 정말 잘했어요!<br>솔솔바람이 함께 응원했어요 💙";
    } else {
      resultTitle.textContent="괜찮아, 다시 해보자! 🌱";
      resultText.innerHTML="조금씩 익숙해지면 더 멀리 갈 수 있어요.<br><b>이중점프</b>도 활용해보세요!";
    }
    resultText.innerHTML+=`<br><b>총 ${score}점</b><br>달리기 ${Math.floor(camera/12)} · 별/콤보 ${starPoints} · 퀴즈 ${quizPoints}<br>모은 별 ${collected}개 · 통과한 퀴즈 ${quizIndex}/3`;
    restartBtn.focus();
  }

  function openQuiz() {
    quizActive=true; quizSolved=false;
    quizPanel.style.display='block'; quizContinue.style.display='none';
    document.getElementById('quizQuestion').textContent=`${quizIndex+1}/3 · ${questions[quizIndex].q}`;
    quizFeedback.textContent='달리기는 잠시 멈췄어요. 천천히 골라 보세요!';
    quizChoices.replaceChildren();
    questions[quizIndex].a.forEach((text,index)=>{
      const button=document.createElement('button'); button.type='button'; button.textContent=text;
      button.addEventListener('click',()=>answerQuiz(index)); quizChoices.appendChild(button);
    });
    quizChoices.children[0].focus(); updateHud();
  }
  function answerQuiz(index) {
    if(!quizActive || quizSolved) return;
    const question=questions[quizIndex];
    if(index!==question.correct) {
      quizFeedback.textContent='괜찮아요! '+question.hint+' 다른 답을 골라보세요.';
      quizChoices.children[index].disabled=true;
      Array.from(quizChoices.children).find(b=>!b.disabled).focus(); return;
    }
    quizSolved=true; quizPoints+=100; updateHud();
    quizFeedback.textContent='정답이에요! +100점 · 몽글이가 길을 열어줬어요!';
    Array.from(quizChoices.children).forEach(b=>b.disabled=true);
    quizContinue.style.display='inline-block'; quizContinue.focus();
  }
  function resumeQuiz() {
    if(!quizSolved) return;
    quizContinue.blur();
    quizActive=false; quizSolved=false; quizIndex++;
    quizPanel.style.display='none'; invincible=Math.max(invincible,75);
    lastTime=0; accumulator=0;
  }

  function obstacleHit(rx,ry,rw,rh,o,screenX) {
    // 모양마다 실제 보이는 부분에 맞춰 충돌 범위를 조금씩 다르게 설정
    let insetX=.18, insetTop=.20, insetBottom=.04;
    if(o.style === "capsule") { insetX=.08; insetTop=.10; insetBottom=.08; }
    else if(o.style === "vial") { insetX=.12; insetTop=.08; insetBottom=.03; }
    else if(o.style === "doubleSpike") { insetX=.10; insetTop=.22; insetBottom=.02; }
    else if(o.style === "crystal") { insetX=.14; insetTop=.16; insetBottom=.03; }
    const hitX = screenX + o.w*insetX;
    const hitW = o.w*(1-insetX*2);
    const hitY = o.y + o.h*insetTop;
    const hitH = o.h*(1-insetTop-insetBottom);
    return rx < hitX+hitW && rx+rw > hitX && ry < hitY+hitH && ry+rh > hitY;
  }

  function burst(x,y,color) {
    for(let i=0;i<10;i++) {
      particles.push({
        x,y,
        vx:(Math.random()-.5)*4,
        vy:-Math.random()*3,
        life:22+Math.random()*12,
        color
      });
    }
  }

  function roundRect(x,y,w,h,r) {
    const rr=Math.min(r,w/2,h/2);
    ctx.beginPath();
    ctx.moveTo(x+rr,y);
    ctx.arcTo(x+w,y,x+w,y+h,rr);
    ctx.arcTo(x+w,y+h,x,y+h,rr);
    ctx.arcTo(x,y+h,x,y,rr);
    ctx.arcTo(x,y,x+w,y,rr);
    ctx.closePath();
  }

  function drawBackground() {
    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,"#102a67");
    g.addColorStop(0.63,"#155f8c");
    g.addColorStop(1,"#1e7e88");
    ctx.fillStyle=g;
    ctx.fillRect(0,0,W,H);

    ctx.globalAlpha=.14;
    ctx.strokeStyle="#bff6ff";
    ctx.lineWidth=1;
    const grid=44;
    const off=-(camera*.22)%grid;
    for(let x=off;x<W;x+=grid) {
      ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,ground);ctx.stroke();
    }
    for(let y=70;y<ground;y+=grid) {
      ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();
    }
    ctx.globalAlpha=1;

    ctx.fillStyle="#0b254f";
    ctx.fillRect(0,ground,W,H-ground);
    ctx.fillStyle="#5ee7f2";
    ctx.fillRect(0,ground, W, 5);
  }

  function drawObstacle(o) {
    const x=o.x-camera;
    if(x<-110 || x>W+110) return;

    ctx.save();
    ctx.translate(x,o.y);
    ctx.lineWidth=2.5; ctx.strokeStyle='#f2f8ff'; ctx.lineJoin='round';
    const colors={capsule:'#ff8fbd',syringe:'#79dfff',vial:'#a6e5bf',bandage:'#ffc58c',vitamin:'#d2acff'};
    ctx.shadowColor=colors[o.style]; ctx.shadowBlur=10;
    ctx.fillStyle=colors[o.style];
    if(o.style==='capsule') {
      roundRect(0,2,o.w,o.h-4,16);ctx.fill();ctx.stroke();
      ctx.shadowBlur=0;ctx.fillStyle='#fff4fb';roundRect(o.w/2,4,o.w/2-3,o.h-8,12);ctx.fill();
      ctx.strokeStyle='#cf588f';ctx.beginPath();ctx.moveTo(o.w/2,5);ctx.lineTo(o.w/2,o.h-5);ctx.stroke();
    } else if(o.style==='syringe') {
      roundRect(10,10,o.w-20,o.h-19,4);ctx.fill();ctx.stroke();
      ctx.fillStyle='#c6f5ff';ctx.fillRect(15,2,o.w-30,8);ctx.fillRect(8,0,o.w-16,4);
      ctx.strokeStyle='#fff';ctx.beginPath();ctx.moveTo(o.w/2,o.h-9);ctx.lineTo(o.w/2,o.h);ctx.stroke();
      ctx.strokeStyle='#288eb2';for(let i=0;i<3;i++){ctx.beginPath();ctx.moveTo(12,16+i*6);ctx.lineTo(20,16+i*6);ctx.stroke();}
    } else if(o.style==='vial') {
      roundRect(3,10,o.w-6,o.h-11,9);ctx.fill();ctx.stroke();
      ctx.fillStyle='#78bdc2';roundRect(9,0,o.w-18,12,3);ctx.fill();
      ctx.fillStyle='#fff';roundRect(9,23,o.w-18,16,4);ctx.fill();
      ctx.fillStyle='#42a785';ctx.fillRect(o.w/2-2,25,4,12);ctx.fillRect(o.w/2-6,29,12,4);
    } else if(o.style==='bandage') {
      roundRect(0,5,o.w,o.h-10,12);ctx.fill();ctx.stroke();
      ctx.fillStyle='#e59a61';roundRect(o.w*.3,9,o.w*.4,o.h-18,4);ctx.fill();
      ctx.fillStyle='#fff2de';for(const xx of [7,o.w-7])for(const yy of [15,23,31]){ctx.beginPath();ctx.arc(xx,yy,1.5,0,Math.PI*2);ctx.fill();}
    } else {
      ctx.beginPath();ctx.ellipse(o.w/2,o.h/2,o.w/2-2,o.h/2-2,0,0,Math.PI*2);ctx.fill();ctx.stroke();
      ctx.strokeStyle='#8b63bc';ctx.beginPath();ctx.moveTo(12,12);ctx.lineTo(o.w-12,o.h-12);ctx.stroke();
    }
    ctx.shadowBlur=0;ctx.fillStyle='#ffffff80';roundRect(7,12,4,10,2);ctx.fill();ctx.restore();

    // 장애물 이름
    const label=o.label;
    let fontSize = label.length > 6 ? 12 : 13;
    ctx.font=`800 ${fontSize}px Arial, "Apple SD Gothic Neo", sans-serif`;
    const tw = ctx.measureText(label).width;
    const padX=10;
    const bw=Math.min(148,tw+padX*2);
    const bx=x+o.w/2-bw/2;
    const by=o.y-34;
    ctx.fillStyle="rgba(255,255,255,.95)";
    ctx.strokeStyle="#8be9f5";
    ctx.lineWidth=2;
    roundRect(bx,by,bw,25,10);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle="#17466c";
    ctx.textAlign="center";
    ctx.textBaseline="middle";
    ctx.fillText(label,x+o.w/2,by+12.5);
  }

  function drawStar(s) {
    if(s.taken) return;
    const x=s.x-camera;
    if(x<-30 || x>W+30) return;
    ctx.save();
    ctx.translate(x,s.y);
    ctx.rotate(frame*.035);
    ctx.fillStyle="#ffe05f";
    ctx.strokeStyle="#fff4aa";
    ctx.lineWidth=2;
    ctx.beginPath();
    for(let i=0;i<10;i++) {
      const a=-Math.PI/2+i*Math.PI/5;
      const r=i%2===0 ? 15 : 6.5;
      const px=Math.cos(a)*r, py=Math.sin(a)*r;
      if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    }
    ctx.closePath();ctx.fill();ctx.stroke();
    ctx.restore();
  }

  function drawPlayer() {
    ctx.save();
    if(invincible && Math.floor(frame/6)%2===0) ctx.globalAlpha=.35;
    ctx.translate(player.x+player.w/2,player.y+player.h/2);
    ctx.rotate(player.rotation);
    const bob = Math.sin(frame*.12)*1.5;
    if(solsolImg.complete && solsolImg.naturalWidth) {
      ctx.drawImage(solsolImg,-player.w/2,-player.h/2+bob,player.w,player.h);
    } else {
      ctx.fillStyle="#aeeffc";
      ctx.beginPath();ctx.arc(0,0,25,0,Math.PI*2);ctx.fill();
    }
    ctx.restore();
  }

  function drawParticles() {
    for(const p of particles) {
      ctx.globalAlpha=Math.max(0,p.life/34);
      ctx.fillStyle=p.color;
      ctx.beginPath();
      ctx.arc(p.x,p.y,3.5,0,Math.PI*2);
      ctx.fill();
    }
    ctx.globalAlpha=1;
  }

  function drawCheer() {
    const text = camera < 1100 ? "천천히 시작해보자!" :
                 camera < 2600 ? "잘하고 있어!" :
                 camera < 4000 ? "조금만 더!" : "끝이 보여!";
    ctx.font='700 15px Arial, "Apple SD Gothic Neo", sans-serif';
    const tw=ctx.measureText(text).width;
    const x=Math.max(12,W-tw-42);
    const y=55;
    ctx.fillStyle="rgba(255,255,255,.9)";
    roundRect(x,y,tw+26,34,14);
    ctx.fill();
    ctx.fillStyle="#176c91";
    ctx.textAlign="center";
    ctx.textBaseline="middle";
    ctx.fillText(text,x+(tw+26)/2,y+17);
  }

  function draw() {
    drawBackground();
    stars.forEach(drawStar);
    obstacles.forEach(drawObstacle);
    drawPlayer();
    drawParticles();
    drawCheer();
    ctx.save();ctx.textAlign='center';ctx.font='bold 18px Arial';
    popups.forEach(p=>{ctx.globalAlpha=Math.min(1,p.life/20);ctx.fillStyle='#fff1a3';ctx.fillText(p.text,p.x,p.y)});
    ctx.restore();
    if(paused) {ctx.fillStyle='#08173eb0';ctx.fillRect(0,0,W,H);ctx.fillStyle='white';ctx.font='bold 26px Arial';ctx.textAlign='center';ctx.fillText('잠시 쉬는 중',W/2,H/2);}

  }

  function loop(now=performance.now()) {
    if(!running) return;
    if(!lastTime) lastTime=now;
    accumulator+=Math.min(50,now-lastTime); lastTime=now;
    while(accumulator>=1000/60) { update();accumulator-=1000/60; }
    draw();
    if(running) animationId=requestAnimationFrame(loop);
  }

  function handleJump(e) {
    if(e) e.preventDefault();
    jump();
  }

  window.addEventListener("resize",()=>{
    const oldGround=ground; resize(); const offset=ground-oldGround;
    if(running) player.y+=offset;
    obstacles.forEach(o=>o.y+=offset); stars.forEach(s=>s.y+=offset); draw();
  });
  quizContinue.addEventListener('click',resumeQuiz);
  speedSelect.addEventListener('change',()=>speedSelect.blur());
  pauseBtn.addEventListener('click',()=>{if(!running || quizActive)return;paused=!paused;pauseBtn.textContent=paused?'계속하기':'일시정지';lastTime=0;accumulator=0;});
  document.addEventListener('visibilitychange',()=>{if(document.hidden && running && !quizActive){paused=true;pauseBtn.textContent='계속하기';}});
  quizPanel.addEventListener('keydown',e=>{
    if(e.key!=='Tab')return;
    const items=Array.from(quizChoices.children).filter(b=>!b.disabled);
    if(quizSolved)items.push(quizContinue);
    const first=items[0],last=items[items.length-1];
    if(e.shiftKey && document.activeElement===first){e.preventDefault();last.focus();}
    else if(!e.shiftKey && document.activeElement===last){e.preventDefault();first.focus();}
  });
  canvas.addEventListener("pointerdown",handleJump,{passive:false});
  window.addEventListener("keydown",(e)=>{
    if(e.repeat || ['SELECT','BUTTON','INPUT'].includes(e.target.tagName)) return;
    if(e.code==="Space" || e.code==="ArrowUp") {
      e.preventDefault();
      jump();
    }
  });

  startBtn.addEventListener("click",startGame);
  restartBtn.addEventListener("click",startGame);

  resize();
  buildLevel();
  draw();
})();
</script>
